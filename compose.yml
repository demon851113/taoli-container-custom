# 以上游 compose.yml 為底，container 服務多三個 bind mount（見 # CUSTOM 標記），其餘原樣
version: "3.9"

services:
  container:
    image: ghcr.io/aliez-ren/taoli-tools-container:latest
    volumes:
      - data:/home/taoli/data
      - tailscale:/home/taoli/.local/share/tailscale/
      - /mnt:/home/taoli/cert
      - /opt/taoli/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro   # CUSTOM 覆蓋啟動腳本
      - /opt/taoli/ext:/home/taoli/ext:ro                          # CUSTOM 插件目錄（每個插件一個子資料夾）
      - /opt/taoli/share:/home/taoli/share                         # CUSTOM 一般檔案交換區（雙向可寫）
      - /opt/taoli/index.html:/usr/share/novnc/index.html:ro            # CUSTOM noVNC 壓縮2/品質6（上游 9/0 吃 CPU）
    networks:
      - public
      - private
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 0s
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first

  signer:
    image: ghcr.io/taoli-tools/taoli-tools-signer:latest
    secrets:
      - KEYCHAIN
      - CERT.pem
      - KEY.pem
    networks:
      - private
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 0s
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first

networks:
  public:
    driver: overlay
    attachable: true
  private:
    driver: overlay
    attachable: true
    internal: true

volumes:
  data:
    driver: local
  tailscale:
    driver: local

secrets:
  KEYCHAIN:
    file: keychain.toml
  CERT.pem:
    file: CERT.pem
  KEY.pem:
    file: KEY.pem
